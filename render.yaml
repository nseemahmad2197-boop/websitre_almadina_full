services:
  - type: web
    name: almadina-express
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: DEPLOY_TARGET
        value: render
      - key: VINEXT_TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: almadina-express-db
          property: connectionString
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: Almadina Express
      - key: GEOAPIFY_API_KEY
        sync: false

databases:
  - name: almadina-express-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    ipAllowList: []
