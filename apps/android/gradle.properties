# Keep one bounded JVM for both Gradle and the Kotlin compiler. This avoids
# "Could not connect to Kotlin compile daemon" on lower-memory macOS devices.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2

# The Kotlin daemon is faster when healthy, but the in-process strategy is more
# reliable on machines where the daemon cannot open its local connection.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
